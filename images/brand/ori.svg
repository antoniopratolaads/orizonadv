<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" role="img" aria-label="Ori, il robottino di Orizon">
<style>
.occhi{transform-origin:150px 140px;animation:ori-blink 4.6s infinite}
.braccio{transform-origin:233px 254px;animation:ori-wave 3.2s ease-in-out infinite}
.luce{animation:ori-luce 2.2s ease-in-out infinite}
@keyframes ori-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes ori-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
@keyframes ori-luce{0%,100%{opacity:1}50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.occhi,.braccio,.luce{animation:none}}
</style>
<!-- antenna -->
<rect x="147" y="44" width="6" height="30" rx="3" fill="#0C1713"/>
<circle class="luce" cx="150" cy="38" r="10" fill="#60E787"/>
